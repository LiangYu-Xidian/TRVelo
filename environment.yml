name: trvelo_env
channels:
  - pytorch
  - pyg
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8.12
  - pip
  # PyTorch Core (CUDA 11.3 match)
  - pytorch=1.11.0
  - torchvision=0.12.0
  - cudatoolkit=11.3
  # Jupyter Support (for .ipynb files)
  - ipykernel=6.16.2
  - pip:
    # --- Scientific Computing ---
    - numpy==1.23.4
    - pandas==1.5.0
    - scipy==1.9.3
    - matplotlib==3.6.2
    - scikit-learn==1.1.3
    - tqdm==4.65.0
    
    # --- Single Cell Analysis ---
    - anndata==0.9.2
    - scanpy==1.9.1
    - scvelo==0.2.5
    - loompy==3.0.7
    - umap-learn==0.5.3
    
    # --- Graph Neural Networks (PyG) ---
    # Strictly matching your installed versions
    - torch-geometric==1.7.2
    - torch-scatter==2.0.9
    - torch-sparse==0.6.13
    - torch-cluster==1.6.0
    - torch-spline-conv==1.2.1
    
    # --- Utilities/Dependencies ---
    - h5py==3.7.0
    - networkx==2.8.8
    - joblib==1.2.0